<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>SimpanSikit</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SimpanSikit">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Pixelify+Sans:wght@400;600&family=Rajdhani:wght@700&display=swap">
<style>
/* Layout: one night look (Moon Ledger). Moonlit bay header, system panels with thick cartoon outlines, Luna's speech bubble, coin amounts (g/s/c) with RM underneath, floating gold coin to log, bottom bar of five rooms */
:root{
  color-scheme:dark;
  --bg:#141842; --bg2:#1b2158; --card:#222a66; --card2:#2a3377; --ink:#eef0fb; --silver:#c9cee8; --muted:#9ea6d4; --line:#38428a;
  --ol:#070923;
  --sys:#3d7dff; --sys2:#2557d6; --glow:#8fd8ff;
  --gold:#ffc83d; --gold-d:#c98d0c; --teal:#22c3b0; --green:#43d17f; --red:#ff5d55; --red-d:#b8302a; --purple:#a77bff;
  --pop:0 4px 0 var(--ol);
  --f-display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,sans-serif;
  --f-num:"Chakra Petch",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent}
body{background-image:radial-gradient(rgba(255,255,255,.05) 1.4px,transparent 1.5px);background-size:20px 20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0d1035}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num,.cn{font-family:var(--f-num);font-weight:700;font-variant-numeric:tabular-nums}
.rmv{display:block;font-size:.72em;font-weight:700;color:var(--muted);font-family:var(--f-num);font-variant-numeric:tabular-nums}
body.hide .m{filter:blur(8px)}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}

/* header */
.top{background:linear-gradient(180deg,#0d1035,#1c2a7a);position:relative;overflow:hidden}
.top .wrap{padding-block:14px 60px;position:relative;z-index:2}
.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 12% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 35% 15%,#fffc,transparent),radial-gradient(2px 2px at 58% 42%,#fff9,transparent),radial-gradient(1.5px 1.5px at 8% 72%,#fffa,transparent),radial-gradient(1.5px 1.5px at 46% 78%,#fff8,transparent),radial-gradient(1.5px 1.5px at 70% 12%,#fff9,transparent)}
.scene{position:absolute;right:0;bottom:8px;width:270px;max-width:66%;z-index:1}
.waves{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:34px;z-index:3}
.waves .w1{fill:#2f5fc0;stroke:var(--ol);stroke-width:2.5}
.waves .w2{fill:var(--bg);stroke:var(--ol);stroke-width:3}
.hrow{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-size:36px;line-height:1;color:var(--gold);-webkit-text-stroke:1.5px var(--ol);text-shadow:0 3px 0 var(--ol);letter-spacing:.5px}
.brand small{display:block;font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--silver);letter-spacing:.16em;text-transform:uppercase;margin-top:6px;text-shadow:none;-webkit-text-stroke:0}
.hrow .sp{flex:1}
.ibtn{width:44px;height:44px;border-radius:14px;border:3px solid var(--ol);background:var(--sys);color:#fff;display:grid;place-items:center;box-shadow:0 3px 0 var(--ol)}
.ibtn svg{width:22px;height:22px}
.month{display:inline-flex;align-items:center;gap:6px;margin-top:14px}
.month button{border:3px solid var(--ol);background:var(--gold);color:var(--ol);width:38px;height:38px;border-radius:12px;font-size:20px;font-weight:900;box-shadow:0 3px 0 var(--ol);line-height:1}
.month b{font-family:var(--f-display);font-weight:400;font-size:20px;min-width:150px;text-align:center;text-shadow:0 2px 0 var(--ol)}

/* headings, cards */
h2{font-family:var(--f-display);font-weight:400;font-size:25px;line-height:1.05;margin:26px 0 10px;text-wrap:balance}
h2 small{display:block;font-family:var(--f-num);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px;color:var(--glow)}
h2.k-gold small{color:var(--gold)} h2.k-teal small{color:var(--teal)} h2.k-green small{color:var(--green)} h2.k-red small{color:var(--red)} h2.k-purple small{color:var(--purple)}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--pop);border:3px solid var(--ol);position:relative}
.stack{display:flex;flex-direction:column;gap:12px}
.lbl{font-size:11.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.pos{color:var(--green)} .neg{color:var(--red)} .goldt{color:var(--gold)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{border:3px solid var(--ol);border-radius:14px;padding:11px 16px;font-weight:900;background:var(--sys);color:#fff;box-shadow:0 4px 0 var(--ol);min-height:48px}
.btn.y{background:var(--gold);color:var(--ol)}
.btn.g{background:var(--card2);color:var(--ink)}
.btn.r{background:var(--red);color:#fff}
.btn.sm{min-height:40px;padding:6px 12px;border-radius:12px;font-size:14px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ol)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:12px;font-weight:700}
.hint{font-size:13px;color:var(--muted);font-weight:700;margin:-4px 0 12px}

/* Luna */
.luna{display:flex;gap:10px;align-items:flex-end;margin-top:14px}
.luna svg{width:54px;height:54px;flex:none}
.bubble{position:relative;background:var(--card2);border:3px solid var(--ol);border-radius:18px 18px 18px 6px;padding:10px 12px;font-weight:700;font-size:14.5px;box-shadow:var(--pop);flex:1;min-width:0}
.bubble b{display:block;font-family:var(--f-num);font-size:11px;letter-spacing:.14em;color:var(--purple);text-transform:uppercase;margin-bottom:2px}
.bubble.warn{background:color-mix(in srgb,var(--red) 22%,var(--card))}
.bubble .pl{font-family:var(--f-num);font-size:13px;color:#ffb3ae;margin-bottom:4px}

/* hero: Dawn panel */
.hero{background:linear-gradient(180deg,var(--sys),var(--sys2));color:#fff;border-radius:22px;padding:14px 16px 16px;box-shadow:0 5px 0 var(--ol),0 0 0 4px color-mix(in srgb,var(--glow) 35%,transparent);margin-top:-32px;position:relative;z-index:4;border:3px solid var(--ol)}
.sys-h{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-num);font-weight:700;font-size:12.5px;letter-spacing:.1em;color:var(--glow);border-bottom:2px dashed rgba(143,216,255,.5);padding-bottom:8px;margin-bottom:10px}
.hero .lbl{color:#d6e6ff}
.hero .big{font-family:var(--f-num);font-weight:700;font-size:38px;line-height:1.05;margin:2px 0 0;color:var(--gold);text-shadow:0 3px 0 var(--ol);-webkit-text-stroke:1px var(--ol)}
.hero .bigrm{font-family:var(--f-num);font-weight:700;color:#cfe0ff;font-size:14px;margin-bottom:6px}
.lines{font-family:var(--f-num);font-weight:600;font-size:14px;background:rgba(5,12,60,.35);border-radius:14px;padding:10px 12px;border:2px solid rgba(143,216,255,.3);display:flex;flex-direction:column;gap:4px}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines span:first-child{color:#cfe0ff}
.lines .tot{border-top:2px dashed rgba(143,216,255,.45);padding-top:6px;margin-top:2px;color:var(--gold)}
.lines .tot span:first-child{color:var(--gold)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{background:var(--card);border:3px solid var(--ol);border-radius:18px;padding:13px;box-shadow:var(--pop);min-width:0}
.tile .v{font-family:var(--f-num);font-weight:700;font-size:21px;margin-top:4px;line-height:1.1}
.tile .v.t{font-family:var(--f-display);font-weight:400;font-size:23px}
.tile .s{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:700}

/* realm */
.realm{display:flex;gap:14px;align-items:center}
.realm svg{width:64px;height:64px;flex:none}
.realm .tier{font-family:var(--f-display);font-size:26px;line-height:1;color:var(--gold)}
.bar{height:16px;border-radius:99px;background:var(--bg);overflow:hidden;border:2.5px solid var(--ol)}
.bar i{display:block;height:100%;background:var(--sys)}
.bar.gold i{background:linear-gradient(180deg,#ffe07a,var(--gold))}
.bar.green i{background:var(--green)}
.bar.teal i{background:var(--teal)}

/* quests */
.q{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:2px dashed var(--line)}
.q:last-child{border-bottom:0}
.check{width:34px;height:34px;border-radius:11px;border:3px solid var(--ol);background:var(--bg);display:grid;place-items:center;flex:none;color:#fff;font-weight:900}
.check.on{background:var(--teal)}
.check.auto{cursor:default}
.q .t{font-weight:800}
.q .d{font-size:12.5px;color:var(--muted);font-weight:700}

/* lists */
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:2px dashed var(--line)}
.li:last-child{border-bottom:0}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-family:var(--f-display);font-size:15px;flex:none;background:var(--gold);color:var(--ol);border:2.5px solid var(--ol)}
.ic.in{background:var(--green)}
.ic.debt{background:var(--red);color:#fff}
.ic.save{background:var(--purple);color:#fff}
.li .t{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .d{font-size:13px;color:var(--muted);font-weight:700}
.li .a{white-space:nowrap;text-align:right}
.dayhead{display:flex;justify-content:space-between;font-family:var(--f-num);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--muted);margin:16px 4px 5px}

/* pills */
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.pill{border:3px solid var(--ol);border-radius:999px;padding:7px 14px;font-weight:900;background:var(--card);color:var(--ink);white-space:nowrap;font-size:14px;box-shadow:0 3px 0 var(--ol)}
.pill.on{background:var(--sys);color:#fff}

/* categories */
.catrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin:10px 0;font-weight:800;font-size:14px}
.catrow .bar{grid-column:1/-1;height:14px}

/* trend */
.trend{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:10px;position:relative}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.trend .b{width:100%;max-width:34px;border-radius:9px 9px 4px 4px;background:var(--green);border:2.5px solid var(--ol)}
.trend .b.none{background:var(--line);height:6px;border-width:0}
.trend .x{font-size:11px;font-weight:900;color:var(--muted)}
.trend .est{position:absolute;left:0;right:0;border-top:3px dashed var(--gold)}

/* foes */
.foes{display:flex;flex-direction:column;gap:12px}
.foe{background:var(--card);border:3px solid var(--ol);border-radius:20px;padding:12px 14px;text-align:left;box-shadow:var(--pop);position:relative;width:100%;overflow:hidden;color:var(--ink)}
.foe-top{display:flex;align-items:center;gap:12px}
.foe-top svg{width:48px;height:48px;flex:none}
.foe-n{font-family:var(--f-display);font-size:19px;line-height:1.1}
.foe-m{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:2px}
.hpl{display:flex;justify-content:space-between;align-items:flex-end;font-family:var(--f-num);font-weight:700;font-size:13px;margin:10px 0 4px;gap:8px}
.hpl>span:first-child{color:var(--red)}
.hp{height:16px;border-radius:99px;background:var(--bg);border:2.5px solid var(--ol);overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(180deg,#ff8a80,var(--red))}
.foe .tag{background:var(--gold);color:var(--ol);border:2px solid var(--ol);font-size:12px;font-weight:900;border-radius:99px;padding:2px 8px;flex:none;white-space:nowrap}
.foe.done{background:color-mix(in srgb,var(--green) 14%,var(--card))}
.foe.done .foe-top svg{filter:grayscale(1);opacity:.45}
.seal{position:absolute;right:14px;top:12px;transform:rotate(-12deg);background:var(--green);color:var(--ol);border:3px solid var(--ol);font-family:var(--f-display);font-size:18px;padding:4px 10px;border-radius:8px;box-shadow:0 3px 0 var(--ol)}

/* armies */
.army{display:flex;gap:14px;align-items:center}
.army svg{width:70px;height:78px;flex:none}
.army .hc{font-family:var(--f-num);font-weight:700;font-size:26px;line-height:1.05}
.floor{display:inline-block;background:var(--red);color:#fff;border:2px solid var(--ol);border-radius:99px;font-size:11px;font-weight:900;padding:1px 8px;letter-spacing:.06em}

/* banner */
.ping{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:70;width:min(92%,440px);background:linear-gradient(180deg,#ffe07a,var(--gold));color:var(--ol);border:3px solid var(--ol);border-radius:16px;box-shadow:0 5px 0 var(--ol);padding:10px 14px;font-family:var(--f-num);font-weight:700;font-size:14px;text-align:center}
.ping b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px}

/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
nav.bottom .in{max-width:520px;margin:0 auto;background:var(--card);border:3px solid var(--ol);border-radius:24px;box-shadow:0 5px 0 var(--ol);display:grid;grid-template-columns:repeat(5,1fr);padding:5px;pointer-events:auto}
nav.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;border-radius:16px;font-size:11px;font-weight:900;color:var(--muted)}
nav.bottom button svg{width:28px;height:28px}
nav.bottom button.on{background:var(--sys);color:#fff}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:21;width:68px;height:68px;border-radius:50%;border:3.5px solid var(--ol);background:radial-gradient(circle at 35% 30%,#ffe9a0,var(--gold) 55%,var(--gold-d));color:var(--ol);box-shadow:0 5px 0 var(--ol);display:grid;place-items:center}
.fab::after{content:"";position:absolute;inset:7px;border-radius:50%;border:2.5px dashed rgba(7,9,35,.45)}
.fab svg{width:32px;height:32px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(4,5,20,.6);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg2);border:3px solid var(--ol);border-bottom:0;border-radius:26px 26px 0 0;max-height:92%;overflow-y:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:520px;margin:0 auto}
.grab{width:48px;height:6px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:28px;margin:4px 0 12px}
.amt{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--ol);border-radius:18px;padding:8px 14px;box-shadow:0 3px 0 var(--ol)}
.amt span{font-family:var(--f-display);color:var(--muted);font-size:22px}
.amt input{border:0;background:none;outline:none;font-family:var(--f-num);font-weight:700;font-size:34px;width:100%;min-width:0}
.coinprev{font-family:var(--f-num);font-weight:700;color:var(--gold);margin:6px 4px 12px;min-height:20px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field input{background:var(--card);border:3px solid var(--ol);border-radius:14px;padding:10px 12px;font-size:16px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chipb{border:2.5px solid var(--ol);background:var(--card);border-radius:14px;padding:8px 12px;font-weight:900;font-size:14px;box-shadow:0 2px 0 var(--ol)}
.chipb.on{background:var(--gold);color:var(--ol)}
.redpanel{background:color-mix(in srgb,var(--red) 22%,var(--card));border:3px solid var(--ol);border-radius:14px;padding:10px 12px;font-family:var(--f-num);font-weight:700;font-size:13.5px;margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(180px + env(safe-area-inset-bottom,0px));background:var(--sys);color:#fff;border:3px solid var(--ol);box-shadow:0 4px 0 var(--ol);padding:10px 16px;border-radius:14px;font-family:var(--f-num);font-weight:700;z-index:60;font-size:14px;max-width:90%}
textarea.dump{width:100%;min-height:120px;font-family:var(--f-num);font-size:12px;border-radius:12px;border:3px solid var(--ol);background:var(--card);padding:10px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.5}}.ping{animation:drop .35s ease-out}@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}}


/* ===== Retro 2D RPG skin (original: blue menu windows, pixel type) ===== */
:root{
  --bg:#0d0b08; --bg2:#0d0b08; --card:#1c1610; --card2:#14100b; --ink:#e8d3a0; --silver:#e8d3a0; --muted:#b5a27a; --line:rgba(216,220,240,.3);
  --ol:#000; --sys:#6b4f1d; --sys2:#10196a; --glow:#ffffff; --cy:#5fd4ff; --cyd:rgba(255,255,255,.7);
  --gold:#e2b85a; --teal:#4fb3b8; --green:#5fbf7f; --red:#d9534a; --purple:#9b6fd6;
  --f-display:"Press Start 2P",monospace; --f-body:"Pixelify Sans",system-ui,sans-serif; --f-num:"VT323",monospace;
  --winbg:linear-gradient(180deg,#2a2117 0%,#1c1610 55%,#14100b 100%);
  --winbd:2px solid #e8d3a0;
  --winsh:0 0 0 2px #000,inset 0 0 0 1px #000;
}
html,body{font-family:var(--f-body);font-size:16px;font-weight:400;background:#0d0b08;color:#e8d3a0}
body{background-image:none}
body::before{background:#0d0b08}
.num,.cn,.rmv{font-family:var(--f-num);font-weight:400;letter-spacing:0}
.cn{font-size:1.15em}
.top{background:#0d0b08;border-bottom:2px solid #e8d3a0;box-shadow:0 2px 0 #000}
.stars{opacity:.9}
.scene,.waves{display:none}
.hring{position:absolute;right:20px;top:20px;width:46px;height:46px;z-index:1;background:#fff6c8;border-radius:50%;box-shadow:inset -14px -4px 0 #d9cf8f}
@media (max-width:540px){.hring{right:76px}}
.top .wrap{padding-block:16px 40px}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:0;color:#fff;-webkit-text-stroke:0;text-shadow:3px 3px 0 #5a4313}
.brand small{font-family:var(--f-display);font-size:8px;color:var(--gold);letter-spacing:.08em;margin-top:8px}
.ibtn,.month button{background:var(--winbg);border:var(--winbd);box-shadow:var(--winsh);border-radius:6px;color:#fff}
.month b{font-family:var(--f-display);font-size:11px;letter-spacing:0;text-transform:uppercase}
h2{font-family:var(--f-display);font-size:13px;letter-spacing:0;text-transform:uppercase;color:#fff;margin-top:28px;text-shadow:2px 2px 0 #5a4313}
h2 small{font-family:var(--f-display);font-size:8px;letter-spacing:.04em;color:var(--gold)}
.card,.tile,.foe,.bubble,.hero,.sheet,nav.bottom .in,.ping,.toast,.redpanel{background:var(--winbg);border:var(--winbd);border-radius:7px;box-shadow:var(--winsh);clip-path:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.card::before,.tile::before,.hero::before,.hero::after{display:none}
.lbl{font-family:var(--f-display);font-weight:400;font-size:8px;letter-spacing:.04em;color:#e8d7ab;text-transform:uppercase}
.hero{margin-top:-18px}
.sys-h{font-family:var(--f-display);font-size:8px;color:#fff;border-bottom:2px solid rgba(255,255,255,.6);letter-spacing:0}
.hero .big{font-family:var(--f-num);font-size:60px;line-height:.9;color:#fff;-webkit-text-stroke:0;text-shadow:3px 3px 0 #1c1610}
.big,.tile .v,.jade,.cn{-webkit-text-stroke:0}
.hero .bigrm{font-family:var(--f-num);font-size:20px;color:#e8d7ab}
.lines{background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.5);border-radius:4px}
.lines div{font-size:15px}
.tile .v{font-family:var(--f-num);font-size:30px}
.tile .v.t{font-family:var(--f-display);font-size:12px;color:var(--gold);margin-top:6px}
.realm .tier{font-family:var(--f-display);font-size:13px;color:var(--gold)}
.bar{background:#000;border:2px solid #fff;border-radius:0;height:12px}
.bar i{border-radius:0;background:var(--green)}
.bar.gold i{background:var(--gold)}
.bar.teal i{background:var(--teal)}
.check{border:2px solid #fff;border-radius:3px;background:#000;box-shadow:none}
.check.on{background:var(--gold);color:#000}
.q .t,.li .t{font-size:16px}
.q .d,.li .d{font-size:13px;color:#e8d7ab}
.li{border-bottom:2px dotted rgba(255,255,255,.3)}
.ic{background:#000;border:2px solid #fff;border-radius:3px;color:#fff;font-family:var(--f-display);font-size:8px;box-shadow:none}
.btn{font-family:var(--f-display);font-weight:400;font-size:10px;letter-spacing:0;text-transform:uppercase;background:var(--winbg);color:#fff;border:var(--winbd);border-radius:6px;box-shadow:var(--winsh);clip-path:none}
.btn:active{transform:translateY(1px)}
.btn.g{background:#0d0b08}
.btn.r{background:linear-gradient(180deg,#d83a3a,#7a1010)}
.btn:hover::before,.btn:focus-visible::before{content:"▶ "}
.pill,.chipb{font-family:var(--f-body);font-weight:400;background:#0d0b08;border:2px solid #fff;border-radius:5px;box-shadow:none;clip-path:none;color:#fff}
.pill.on,.chipb.on{background:#fff;color:#1c1610;box-shadow:none}
.pill.on::before,.chipb.on::before{content:"▶";margin-right:4px}
.bubble b{font-family:var(--f-display);font-size:9px;color:var(--gold)}
.bubble.warn{background:linear-gradient(180deg,#b8263a,#5a0c18)}
.foe .tag{font-family:var(--f-display);font-size:8px}
.hpl{font-family:var(--f-num)}
.hp{background:#000;border:2px solid #fff;border-radius:0}
.hp i{border-radius:0}
.seal{font-family:var(--f-display)}
nav.bottom .in{padding:4px}
nav.bottom button{font-family:var(--f-display);font-size:7px;letter-spacing:0;color:#e8d7ab;border-radius:4px;text-transform:uppercase}
nav.bottom button.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;text-shadow:none}
nav.bottom button.on::before{content:"▶";position:absolute;margin:-2px 0 0 -40px;font-size:9px;color:#fff}
nav.bottom button{position:relative}
nav.bottom button.on svg{filter:none}
.fab{background:radial-gradient(circle at 35% 30%,#fff4a8,#ffd84a 45%,#c9961a);border:3px solid #fff;box-shadow:0 0 0 2px #000;border-radius:50%;clip-path:none;filter:none;color:#000}
.sheet{border-bottom:0;border-radius:10px 10px 0 0}
.sheet h3{font-family:var(--f-display);font-size:15px;letter-spacing:0;text-transform:uppercase;color:#fff;text-shadow:2px 2px 0 #5a4313}
.grab{background:#fff}
.field input,.amt input,select,textarea.dump{background:#000;border:2px solid #fff;border-radius:4px;color:#fff;font-family:var(--f-body)}
.amt input{font-family:var(--f-num);font-size:40px}
.ping b{font-family:var(--f-display);font-size:16px;color:var(--gold)}
.ping{color:#fff;font-family:var(--f-body)}
.toast{font-family:var(--f-display);font-size:9px;color:#fff;line-height:1.5}
.redpanel{background:linear-gradient(180deg,#b8263a,#5a0c18);color:#fff}
.luna svg,.foe-top svg{image-rendering:pixelated}

#title{position:fixed;inset:0;z-index:99;background:linear-gradient(180deg,#05071a 0%,#0d0b08 55%,#1c1610 72%,#0d0b08 73%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:24px}

#title h1{font-family:"Press Start 2P",monospace;font-size:22px;line-height:1.5;color:#e8d3a0;margin:0;text-shadow:3px 3px 0 #5a4313}
#title .sub{font-family:"Press Start 2P",monospace;font-size:9px;color:#e2b85a;margin-top:12px}
#title .shore{position:absolute;left:0;right:0;bottom:22%;height:14px;background:repeating-linear-gradient(90deg,#4fb3b8 0 8px,transparent 8px 16px);opacity:.5}
#title .go{font-family:"Press Start 2P",monospace;font-size:11px;color:#fff;margin-top:44px}
@media (prefers-reduced-motion:no-preference){#title .go{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}}
#title.out{opacity:0;transition:opacity .35s}

.bscreen{margin:-14px 0 4px;position:relative;z-index:2}
.bfield{background-size:cover;background-position:center bottom;image-rendering:pixelated;position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;min-height:168px;padding:14px 14px 12px;border:3px solid var(--ink);border-radius:6px;box-shadow:0 0 0 2px #000,4px 4px 0 2px #000;background:linear-gradient(180deg,#000 0%,var(--card) 60%,#3a3216 60%,#231d0c 100%);overflow:hidden}
.bfield::before{display:none}
.bfield{background-size:cover!important;background-repeat:no-repeat!important}
.bfield .bmoon{position:absolute;right:18px;top:12px;width:22px;height:22px;border-radius:50%;box-shadow:-6px 3px 0 0 #f4e7b8}
.bfoe{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:none;border:0;padding:0;color:var(--ink);text-align:left;cursor:pointer;z-index:1}
.pxi{image-rendering:pixelated;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.6))}
.bfoe .pxi{width:96px;height:96px}
.bfoe.none{cursor:default;align-self:center}
.bfn{font-family:var(--f-display);font-size:9px;line-height:1.5;text-shadow:2px 2px 0 #000;max-width:170px;background:rgba(0,0,0,.55);padding:3px 5px}
.bfv{font-family:var(--f-num);font-size:17px;text-shadow:2px 2px 0 #000;background:rgba(0,0,0,.55);padding:0 5px}
.bfhp{display:block;width:120px;height:8px;border:2px solid var(--ink);background:#300;box-shadow:2px 2px 0 #000}
.bfhp i{display:block;height:100%;background:var(--red)}
.bparty{display:flex;align-items:flex-end;gap:2px;z-index:1}
.bp{display:flex;flex-direction:column;align-items:center;gap:3px}
.bp .pxi{width:44px;height:58px}
.bp.lead .pxi{width:64px;height:64px}
.bp em{background:rgba(0,0,0,.55);padding:0 3px;font-style:normal;font-family:var(--f-num);font-size:13px;color:var(--ink);text-shadow:1px 1px 0 #000;white-space:nowrap;max-width:76px;overflow:hidden;text-overflow:ellipsis}
.bmenu{display:grid;grid-template-columns:minmax(104px,34%) 1fr;gap:8px;margin-top:8px}
.bmenu .card{padding:8px}

.bcmd button:hover::before,.bcmd button:focus-visible::before,.bcmd button:first-child::before{opacity:1}
.bcmd:hover button:first-child:not(:hover)::before,.bcmd:focus-within button:first-child:not(:focus-visible)::before{opacity:0}
.brow{display:grid;grid-template-columns:auto 26px 1fr;column-gap:6px;align-items:center;padding:3px 0 5px;color:var(--ink)}
.bn{font-family:var(--f-display);font-size:8px}
.bl{font-family:var(--f-display);font-size:8px;color:var(--gold);text-align:right}
.bv{font-family:var(--f-num);font-size:18px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb{grid-column:1/-1;display:block;height:7px;border:1px solid var(--ink);background:#000;margin-top:2px}
.bb i{display:block;height:100%}
.bb.hp i{background:var(--green)}.bb.mp i{background:var(--teal)}.bb.sp i{background:var(--gold)}.bb.xp i{background:var(--purple)}
@media (prefers-reduced-motion:no-preference){.bfoe .pxi{animation:bob 1.2s steps(2) infinite}.bp .pxi{animation:bob 1s steps(2) infinite}.bp:nth-child(2) .pxi{animation-delay:.33s}.bp:nth-child(3) .pxi{animation-delay:.66s}@keyframes bob{50%{transform:translateY(-3px)}}}
.luna{align-items:flex-start}
.luna .bubble{position:relative;padding-top:20px}
.luna .bubble b:first-child{position:absolute;left:10px;top:-10px;background:var(--card);border:2px solid var(--ink);padding:3px 7px;border-radius:4px;font-size:8px}
/* ===== Summon Hall (card fragments → rewards) ===== */
.sumbar{display:flex;gap:10px;align-items:center;margin-top:10px}
.btn.sum{background:linear-gradient(90deg,rgba(177,140,255,.25),rgba(255,209,102,.25));color:#fff;border-color:var(--purple);box-shadow:0 0 16px rgba(177,140,255,.45)}
@media (prefers-reduced-motion:no-preference){.btn.sum.ready{animation:sumpulse 1.8s ease-in-out infinite}@keyframes sumpulse{50%{box-shadow:0 0 26px rgba(255,209,102,.7)}}}
.stage{perspective:900px;display:flex;justify-content:center;margin:8px 0 14px}
.scard{width:210px;height:300px;position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1);cursor:pointer;border:0;background:none;padding:0}
.scard.flip{transform:rotateY(180deg)}
.scard .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.scard .back{background:radial-gradient(circle at 50% 40%,rgba(95,212,255,.25),transparent 60%),linear-gradient(180deg,#0b2440,#040a14);box-shadow:inset 0 0 0 1px var(--cyd),inset 0 0 40px rgba(95,212,255,.2)}
.scard .back svg{width:110px;height:110px;filter:drop-shadow(0 0 10px rgba(95,212,255,.8))}
.scard .wheel{font-family:var(--f-num);font-size:13px;letter-spacing:.2em;margin-top:14px;min-height:20px;text-transform:uppercase}
.scard .tap{font-family:var(--f-num);font-size:11px;letter-spacing:.18em;color:var(--muted);margin-top:8px}
.scard .front{transform:rotateY(180deg);background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--gc) 35%,transparent),transparent 65%),linear-gradient(180deg,#0c1d33,#040a14);box-shadow:inset 0 0 0 2px var(--gc),inset 0 0 40px color-mix(in srgb,var(--gc) 30%,transparent)}
.scard .gr{font-family:var(--f-num);font-size:12px;letter-spacing:.24em;color:var(--gc);text-shadow:0 0 10px var(--gc);text-transform:uppercase}
.scard .rw{font-family:"Rajdhani",sans-serif;font-weight:700;font-size:24px;line-height:1.05;margin:8px 0 4px;color:#fff;text-shadow:0 0 12px var(--gc)}
.scard .ty{font-family:var(--f-num);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.scard .ln{font-size:14px;color:var(--silver);margin-top:10px;line-height:1.25}
.scard .ic2 svg{width:74px;height:74px}
.sumnote{text-align:center;font-family:var(--f-num);font-size:12px;letter-spacing:.08em;color:var(--gold);min-height:18px;margin-bottom:10px}
.odds{font-family:var(--f-num);font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px}
.odds b{font-weight:400}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hcell{border:1px solid var(--line);background:rgba(95,212,255,.04);padding:8px 4px;text-align:center;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.hcell svg{width:44px;height:44px}
.hcell .nm{font-size:12px;line-height:1.05;font-weight:700}
.hcell .gd{font-family:var(--f-num);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.hcell.lock{opacity:.45}
.hcell.on{border-color:var(--purple);box-shadow:0 0 14px rgba(177,140,255,.5);background:rgba(177,140,255,.12)}
.hcell .act{font-family:var(--f-num);font-size:9px;color:var(--purple);letter-spacing:.1em}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bdg{font-size:13px;padding:5px 9px;border:1px solid var(--bc);color:var(--bc);font-weight:700;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.bdg.lock{opacity:.4;border-style:dashed}
.advisor{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.advisor svg{width:46px;height:46px;flex:none}
.advisor .bubble{flex:1}
.advisor .bubble b{color:var(--purple)}
.sheet .li>svg{width:36px;height:36px;flex:none}
.skinrow{display:flex;flex-wrap:wrap;gap:8px}
.skinrow .chipb{display:flex;align-items:center;gap:6px}
.skinrow .dot{width:12px;height:12px;border-radius:50%;background:var(--sc);box-shadow:0 0 8px var(--sc)}

/* ===== AFK battle strip (fixed, above the bottom menu) ===== */
.wrap{padding-block:0 296px}
@media (max-width:540px){.hring{right:70px;width:66px;height:66px;top:22px}.hring::after{left:18px;top:12px;width:32px;height:32px}}
nav.bottom{background:linear-gradient(180deg,rgba(2,6,13,0),#02060d 16px);padding-top:6px}
.fab{bottom:calc(248px + env(safe-area-inset-bottom,0px))}
.toast{bottom:calc(336px + env(safe-area-inset-bottom,0px))}
.afkbar{position:relative;max-width:520px;margin:0 auto 6px;height:150px;display:flex;flex-direction:column;pointer-events:auto;cursor:pointer;background:#050b18;box-shadow:0 0 0 1px var(--cyd),0 0 18px rgba(95,212,255,.18);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);overflow:hidden}
.afkhead{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 10px;height:30px;flex:none}
.afkhead .afkmini{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.afkbar canvas{flex:1;width:100%;min-height:0;display:block}
.afkbar .camp{flex:none;font-family:var(--f-num);font-size:10px;letter-spacing:.12em;color:#02060d;background:var(--gold);padding:5px 8px;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);box-shadow:0 0 10px rgba(255,209,102,.6)}
.jade{font-family:var(--f-num);font-size:15px;white-space:nowrap;color:#7dffcf;text-shadow:0 0 10px rgba(61,255,168,.6)}
.jade small{font-size:10px;color:var(--muted);letter-spacing:.12em;margin-left:4px}
.afkmini{font-family:var(--f-num);font-size:9.5px;color:var(--muted);letter-spacing:.06em}
.sheet .jade{font-size:22px}
.shop .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.shop .it:last-child{border-bottom:0}
.shop .it svg{width:40px;height:40px;flex:none}
.shop .it .t{font-weight:700;font-size:16px}
.shop .it .d{font-size:13px;color:var(--muted)}
.shop .it .btn{min-width:96px;font-family:var(--f-num);font-size:14px}
.shop .it .btn[disabled]{opacity:.4}

/* ===== Souls, Merit, Kingdom Tower ===== */
.prog2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.prog2 .tile{padding:10px}
.prog2 .v{font-size:18px}
.skipb{width:100%;margin-top:8px}
.foe-b{font-size:12px;color:var(--gold);font-weight:700;margin-top:1px}

/* ===== Lord Sheet, classes, talents, party ===== */
.lordc .row{align-items:center}
.lordc .lv{font-family:var(--f-num);font-size:30px;color:var(--gold);line-height:1}
.statg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{padding:8px 10px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.stat .k{display:flex;justify-content:space-between;align-items:baseline}
.stat .k b{font-family:var(--f-num);font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:400}
.stat .k span{font-family:var(--f-num);font-size:20px;color:var(--ink)}
.stat .d{font-size:12px;color:var(--muted);line-height:1.2;margin-top:2px}
.stat.na .k span{color:var(--muted)}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink)}
.opt.on{border-color:var(--gold);background:rgba(255,209,102,.12)}
.opt[disabled]{opacity:.45}
.opt .t{font-weight:700;font-size:16px}
.opt .d{font-size:13px;color:var(--muted)}
.achv{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.achv:last-child{border-bottom:0}
.achv .ic3{width:22px;text-align:center;font-size:16px}
.achv.lock{opacity:.45}
.sheetline{font-family:var(--f-num);font-size:13px;color:var(--silver);line-height:1.5}
.sheetline b{color:var(--gold);font-weight:400}
.divine{margin-top:8px;font-size:13px;color:var(--purple)}
.hcell .pty{font-family:var(--f-num);font-size:9px;color:var(--gold);letter-spacing:.1em}

/* ===== Retro overrides for Summon Hall + AFK battle ===== */
.scard .face,.hcell,.bdg,.afkbar,.afkbar .camp,.shop .it .btn{clip-path:none}
.scard .face{border-radius:8px}
.scard .back{background:var(--winbg);box-shadow:0 0 0 2px #000;border:3px solid #fff}
.scard .front{border:3px solid var(--gc);box-shadow:0 0 0 2px #000}
.scard .gr,.scard .ty,.scard .wheel,.scard .tap,.sumnote,.odds,.afkmini,.hcell .gd,.hcell .act{font-family:var(--f-display);font-size:8px;letter-spacing:0;text-shadow:none}
.scard .rw{font-family:var(--f-display);font-size:14px;line-height:1.4;text-shadow:2px 2px 0 #000}
.btn.sum{background:linear-gradient(180deg,#8a5bff,#3a1a9c);border-color:#fff;box-shadow:var(--winsh)}
.hcell{background:#0d0b08;border:2px solid rgba(255,255,255,.5);border-radius:6px}
.hcell.on{border-color:var(--gold);background:rgba(255,216,74,.12);box-shadow:none}
.hcell .nm{font-size:12px}
.bdg{border-width:2px;border-radius:4px;font-family:var(--f-body)}
.advisor .bubble b{color:var(--gold)}
.afkbar{background:#0d0b08;border:var(--winbd);border-radius:7px;box-shadow:var(--winsh)}
.afkbar canvas{image-rendering:pixelated}
.afkbar .camp{font-family:var(--f-display);font-size:8px;background:var(--gold);border:2px solid #fff;border-radius:4px;color:#000;box-shadow:none}
.jade{font-family:var(--f-num);font-size:20px;color:#6dff8f;text-shadow:2px 2px 0 #000}
.jade small{font-family:var(--f-display);font-size:7px}
.shop .it .t{font-size:16px}

<script>
(function(){
"use strict";
var KEY="simpansikit.v1";
var CATS=["Housing","Utilities & Internet","Car & Fuel","Food & Groceries","Lyla","Subscriptions","Insurance/Takaful","Sedekah","SB","Other"];
var CAT_AB={"Housing":"HS","Utilities & Internet":"UT","Car & Fuel":"CR","Food & Groceries":"FD","Lyla":"LY","Subscriptions":"SU","Insurance/Takaful":"TK","Sedekah":"SD","SB":"SB","Other":"OT"};
var OLDCAT={"Rumah":"Housing","Utiliti & Internet":"Utilities & Internet","Kereta & Minyak":"Car & Fuel","Makan & Dapur":"Food & Groceries","Anak Lyla":"Lyla","Langganan":"Subscriptions","Insurans/Takaful":"Insurance/Takaful","Lain-lain":"Other"};
var DEBTS=["Atome PayLater","Atome i-Cash","TikTok PayLater","TikTok TrustFinancing-i","Grab PayLater","Ryt Credit PayLater","Atome Card","Boost PayLater"];
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
var MON3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var TIERS=[["Hamlet",0,5000],["Village",5000,20000],["Stronghold",20000,50000],["Town",50000,100000],["Citadel",100000,250000],["City",250000,500000],["County",500000,1000000],["Commandery",1000000,1500000],["Province",1500000,2000000],["Kingdom",2000000,5000000],["Empire",5000000,Infinity]];

function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function pad(x){return (x<10?"0":"")+x}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayStr(){return ymd(new Date())}
function fresh(){
  return {v:2,start:todayStr(),
    settings:{hide:false,method:"snowball",extra:null,soldier:10,tier:null},
    incomes:[{id:"perseni",name:"Perseni salary",est:3500,day:25},{id:"pm",name:"PM salary",est:4300,day:null}],
    debts:DEBTS.map(function(n){return {id:uid(),name:n,bal:null,orig:null,min:null,day:null,rate:null}}),
    commits:[],
    goals:[{id:"saving",name:"Main Army (GX Bank)",target:null,start:null},{id:"ef",name:"Garrison (TnG)",target:null,start:null}],
    quests:{},tx:[]};
}
function migrate(d){if(d&&d.goals)d.goals.forEach(function(g){if(g.id==="saving"&&g.name==="Main Army")g.name="Main Army (GX Bank)";if(g.id==="ef"&&g.name==="Garrison")g.name="Garrison (TnG)"});
  if(!d.start)d.start=todayStr();
  d.settings=d.settings||{};if(d.settings.soldier==null)d.settings.soldier=10;
  d.quests=d.quests||{};
  (d.incomes||[]).forEach(function(i){if(i.name==="Gaji Perseni")i.name="Perseni salary";if(i.name==="Gaji PM")i.name="PM salary"});
  (d.goals||[]).forEach(function(g){if(g.id==="saving"&&g.name==="Saving")g.name="Main Army";if(g.id==="ef"&&g.name==="Emergency Fund")g.name="Garrison"});
  (d.tx||[]).forEach(function(t){if(t.cat&&OLDCAT[t.cat])t.cat=OLDCAT[t.cat]});
  (d.commits||[]).forEach(function(c){if(c.cat&&OLDCAT[c.cat])c.cat=OLDCAT[c.cat]});
  var sm=d.summon=d.summon||{};sm.opened=sm.opened||0;sm.bonus=sm.bonus||0;sm.owned=sm.owned||{};sm.log=sm.log||[];if(sm.hero===undefined)sm.hero=null;sm.skin=sm.skin||"holo";sm.luck=!!sm.luck;if(!sm.starter){sm.starter=true;sm.bonus+=10}
  var fn=d.fin=d.fin||{};fn.souls=fn.souls||0;fn.merit=fn.merit||0;fn.seen=fn.seen||{};fn.cleared=fn.cleared||{};fn.elite=fn.elite||{};fn.log=fn.log||[];fn.skips=fn.skips||{};sm.gcards=sm.gcards||[];
  var af=d.afk=d.afk||{};af.stage=af.stage||1;af.wave=af.wave||0;af.crownDay=af.crownDay||'';
  var af=d.afk;var ld=d.lord=d.lord||{};ld.talents=ld.talents||[];ld.cls=ld.cls||null;ld.party=ld.party||[];ld.phantom=ld.phantom||{g:0,grade:0};ld.ach=ld.ach||{};if(!ld.party.length&&sm.hero)ld.party=[sm.hero];af.jade=af.jade||0;af.last=af.last||Date.now();af.kills=af.kills||0;af.gear=af.gear||{};af.fragBought=af.fragBought||0;af.buys=af.buys||{};
  d.v=2;return d;
}
var storageOK=true,S;
try{var raw=localStorage.getItem(KEY);S=raw?migrate(JSON.parse(raw)):migrate(fresh())}catch(e){storageOK=false;S=migrate(fresh())}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}

var now=new Date(),cur={y:now.getFullYear(),m:now.getMonth()},tab="home",recFilter="all";

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function n(v){return (v===null||v===undefined||v==="")?null:Number(v)}
function rm(v,sign){if(v===null||v===undefined||isNaN(v))return "—";return (sign&&v<0?"−":"")+"RM "+Math.abs(v).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2})}
function coin(v,sign){
  if(v===null||v===undefined||isNaN(v))return "—";
  var c=Math.round(Math.abs(v)*100),g=Math.floor(c/10000),s=Math.floor((c%10000)/100),k=c%100,p=[];
  if(g)p.push(g.toLocaleString("en-MY")+"g");if(s)p.push(s+"s");if(k||!p.length)p.push(k+"c");
  return (sign&&v<0?"−":"")+p.join(" ");
}
function money(v,opt){opt=opt||{};if(v===null||v===undefined||isNaN(v))return '<span class="cn">—</span>';
  return '<span class="cn m '+(opt.cls||"")+'">'+(opt.pre||"")+coin(v,opt.sign)+'</span><span class="rmv m">'+(opt.pre||"")+rm(v,opt.sign)+'</span>'}
function mkey(y,m){return y+"-"+pad(m+1)}
function inMonth(t,y,m){return t.date&&t.date.slice(0,7)===mkey(y,m)}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function dateInMonth(y,m,day){return mkey(y,m)+"-"+pad(Math.min(day||1,dim(y,m)))}
function fmtDate(s){var p=s.split("-");return parseInt(p[2],10)+" "+MON3[parseInt(p[1],10)-1]}
function sum(a,f){return a.reduce(function(s,x){return s+(f?f(x):x)},0)}
function debtById(id){return S.debts.find(function(d){return d.id===id})}
function goalById(id){return S.goals.find(function(g){return g.id===id})}
function incById(id){return S.incomes.find(function(i){return i.id===id})}
function dayNo(){var a=new Date(S.start+"T00:00:00"),b=new Date();b.setHours(0,0,0,0);return Math.max(1,Math.round((b-a)/864e5)+1)}

function commitPaid(c,y,m){return S.tx.some(function(x){return x.commitId===c.id&&inMonth(x,y,m)})}
function debtPaidAmt(d,y,m){return sum(S.tx.filter(function(x){return x.type==="debt"&&x.debtId===d.id&&inMonth(x,y,m)}),function(x){return x.amt})}
function goalSaved(g){return (n(g.start)||0)+sum(S.tx.filter(function(x){return x.type==="save"&&x.goalId===g.id}),function(x){return x.amt})}
function monthTotals(y,m){
  var t=S.tx.filter(function(x){return inMonth(x,y,m)}),o={inc:0,out:0,debt:0,save:0,list:t};
  t.forEach(function(x){o[{in:"inc",out:"out",debt:"debt",save:"save"}[x.type]]+=x.amt});
  o.lebihan=o.inc-o.out-o.debt;o.carry=carryIn(y,m);o.fromArmy=sum(t.filter(function(x){return x.acct&&(x.type==="out"||x.type==="debt")}),function(x){return x.amt});o.baki=o.lebihan-o.save+o.fromArmy+o.carry;
  var uc=S.commits.filter(function(c){return n(c.amt)&&!commitPaid(c,y,m)});
  var ud=S.debts.filter(function(d){return n(d.bal)>0&&n(d.min)&&debtPaidAmt(d,y,m)<d.min});
  o.pending=sum(uc,function(c){return c.amt})+sum(ud,function(d){return Math.min(d.min-debtPaidAmt(d,y,m),d.bal)});
  o.free=o.baki-o.pending;return o;
}
function txNet(x){if(x.acct&&(x.type==="out"||x.type==="debt"))return 0;return x.type==="in"?x.amt:-(n(x.amt)||0)}
var _gsBase=goalSaved;goalSaved=function(g){return _gsBase(g)-sum(S.tx.filter(function(x){return x.acct===g.id&&(x.type==="out"||x.type==="debt")}),function(x){return n(x.amt)||0})};
function carryIn(y,m){var ms=dateInMonth(y,m,1),me=dateInMonth(y,m,dim(y,m)),ob=S.settings.opening,c=0;
  if(ob&&n(ob.amt)!=null&&ob.date){if(ob.date>me)return 0;c=n(ob.amt)||0;
    S.tx.forEach(function(x){if(x.date>=ob.date&&x.date<ms)c+=txNet(x);if(x.date<ob.date&&x.date>=ms&&x.date<=me)c-=txNet(x)});return Math.round(c*100)/100}
  S.tx.forEach(function(x){if(x.date<ms)c+=txNet(x)});return Math.round(c*100)/100}
function openSheetBal(){var ob=S.settings.opening||{};
  openSheet('<h3>Opening balance</h3><div class="hint">Money in your spending accounts (for example your salary account) on that date. Savings pots are set in Armies under "Already saved".</div><div class="amt"><span>RM</span><input id="obAmt" inputmode="decimal" placeholder="0.00" value="'+(ob.amt==null?"":ob.amt)+'"></div><div class="field" style="margin-top:12px"><label class="lbl" for="obDate">As of date</label><input id="obDate" type="date" value="'+(ob.date||todayStr())+'"></div><button class="btn" id="obSave" style="width:100%">Save</button>'+(ob.date?'<button class="btn g" id="obClr" style="width:100%;margin-top:8px">Clear opening balance</button>':''),function(){
    $("obSave").onclick=function(){var a=numVal("obAmt"),d=val("obDate")||todayStr();S.settings.opening=a==null?null:{amt:a,date:d};save();closeSheet();render();toast("Treasury updated")};
    if($("obClr"))$("obClr").onclick=function(){S.settings.opening=null;save();closeSheet();render();toast("Opening balance cleared")}})}
document.addEventListener("click",function(e){if(e.target.closest("#openBal"))openSheetBal()});
function nextPayday(){
  var t=new Date();t.setHours(0,0,0,0);var best=null;
  S.incomes.forEach(function(i){if(!n(i.day))return;
    var d=new Date(t.getFullYear(),t.getMonth(),Math.min(i.day,dim(t.getFullYear(),t.getMonth())));
    if(d<t){d=new Date(t.getFullYear(),t.getMonth()+1,1);d.setDate(Math.min(i.day,dim(d.getFullYear(),d.getMonth())))}
    var days=Math.round((d-t)/864e5);if(!best||days<best.days)best={inc:i,date:d,days:days}});
  return best;
}
function netWorth(){return sum(S.goals,goalSaved)-sum(S.debts,function(d){return n(d.bal)||0})}
function realm(nw){
  var v=Math.max(0,nw),i=0;while(i<TIERS.length-1&&v>=TIERS[i][2])i++;
  var T=TIERS[i],name=T[0],p=T[2]===Infinity?1:(v-T[1])/(T[2]-T[1]);
  if(i<2)name+=" ("+(p<1/3?"Low":p<2/3?"Mid":"High")+")";
  return {i:i,name:name,p:p,next:TIERS[i+1]?TIERS[i+1][0]:null,need:T[2]===Infinity?0:T[2]-v};
}
function simulate(){
  var ds=S.debts.filter(function(d){return n(d.bal)>0}).map(function(d){return {id:d.id,name:d.name,bal:d.bal,min:n(d.min)||0,rate:n(d.rate)||0,done:null}});
  var missing=ds.filter(function(d){return !d.min}).map(function(d){return d.name});
  if(!ds.length)return {months:0,order:[],missing:missing,total:0,done:{}};
  var budget=sum(ds,function(d){return d.min})+(n(S.settings.extra)||0);
  if(budget<=0)return {months:null,order:[],missing:missing,total:sum(ds,function(d){return d.bal}),done:{}};
  var method=S.settings.method,m=0;
  function sortT(a){return a.filter(function(d){return d.bal>0.005}).sort(method==="avalanche"?function(a,b){return b.rate-a.rate||a.bal-b.bal}:function(a,b){return a.bal-b.bal})}
  var order=sortT(ds.slice()).map(function(d){return d.name});
  while(ds.some(function(d){return d.bal>0.005})&&m<600){
    m++;var left=budget;
    ds.forEach(function(d){if(d.bal>0.005)d.bal+=d.bal*d.rate/1200});
    ds.forEach(function(d){if(d.bal>0.005){var p=Math.min(d.min,d.bal,left);d.bal-=p;left-=p}});
    sortT(ds).forEach(function(d){if(left>0){var p=Math.min(d.bal,left);d.bal-=p;left-=p}});
    ds.forEach(function(d){if(d.bal<=0.005&&d.done===null)d.done=m});
  }
  var done={};ds.forEach(function(d){done[d.id]=d.done});
  return {months:m>=600?null:m,order:order,missing:missing,done:done,budget:budget,total:sum(S.debts,function(d){return n(d.bal)||0})};
}
function addMonths(k){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+k);return MON3[d.getMonth()]+" "+d.getFullYear()}

function questState(date){
  var t=S.tx.filter(function(x){return x.date===date}),man=S.quests[date]||{};
  return [
    {k:"log",t:"Log today's spending",d:"Any entry in the ledger today",on:t.length>0,auto:true},
    {k:"meal",t:"One no-spend meal",d:"Tap when you've done it",on:!!man.meal,auto:false},
    {k:"recruit",t:"Recruit soldiers",d:"Put any amount into an army",on:t.some(function(x){return x.type==="save"&&x.amt>0}),auto:true}
  ];
}
function fragments(){
  var days={};S.tx.forEach(function(x){days[x.date]=1});Object.keys(S.quests).forEach(function(d){days[d]=1});
  return Object.keys(days).filter(function(d){return questState(d).every(function(q){return q.on})}).length;

function addPhantom(v){var ph=LD().phantom;ph.g=(ph.g||0)+v;while(ph.g>=100&&ph.grade<PHANTOM_G.length-1){ph.g-=100;ph.grade++;showPing('<b>PING!</b>[Phantom grew → '+PHANTOM_G[ph.grade].toUpperCase()+']<br>[Jade ×'+phantomMult().toFixed(2)+']')}if(ph.grade>=PHANTOM_G.length-1)ph.g=Math.min(ph.g,100)}
function monthlyExpenses(){var c=sum(S.commits,function(x){return n(x.amt)||0})+sum(S.debts,function(d){return n(d.bal)>0?(n(d.min)||0):0});if(c>0)return c;var T=monthTotals(now.getFullYear(),now.getMonth());return T.out>0?T.out:null}
function streakDays(){var days={};S.tx.forEach(function(x){days[x.date]=1});var d=new Date(),k=0;if(!days[todayStr()])d.setDate(d.getDate()-1);
  for(var i=0;i<400;i++){var ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(!days[ds])break;k++;d.setDate(d.getDate()-1)}return k}
function onTimePct(){var a=0,ok=0;S.tx.forEach(function(x){var due=null;if(x.commitId){var c=S.commits.find(function(cc){return cc.id===x.commitId});if(c&&n(c.day))due=c.day}else if(x.type==="debt"&&x.amt>0){var d=debtById(x.debtId);if(d&&n(d.day))due=d.day}
  if(due===null)return;a++;if(parseInt(x.date.slice(8,10),10)<=due)ok++});return a?ok/a:null}
function lordStats(){
  var T=monthTotals(now.getFullYear(),now.getMonth()),ex=monthlyExpenses(),ef=goalById("ef"),efS=ef?goalSaved(ef):0,sim=simulate(),cap=function(v){return Math.max(0,Math.min(99,Math.round(v)))};
  var cash=Math.max(0,T.baki),st=[];
  st.push({k:"HP",n:"Cash buffer",v:ex?cap(cash/ex*16):null,d:ex?(cash/ex).toFixed(1)+" months of expenses in the treasury":"Add payroll to measure"});
  var xtra=n(S.settings.extra);st.push({k:"ATK",n:"Surplus at debt",v:xtra?cap(xtra/10):null,d:xtra?rm(xtra)+" a month above minimums":"Set the extra per month in Moonvault"});
  var pol=S.commits.filter(function(c){return c.cat==="Insurance/Takaful"}).length;st.push({k:"DEF",n:"Protection",v:pol?cap(pol*20):null,d:pol?pol+" takaful/insurance item"+(pol>1?"s":"")+" in payroll":"Add takaful items to payroll"});
  st.push({k:"STR",n:"Savings rate",v:T.inc>0?cap(T.save/T.inc*200):null,d:T.inc>0?Math.round(T.save/T.inc*100)+"% of this month's tribute saved":"Needs tribute this month"});
  st.push({k:"STM",n:"Emergency fund",v:ex?cap(efS/ex*16):null,d:ex?(efS/ex).toFixed(1)+" months held in the Garrison":"Add payroll to measure"});
  var hasDebt=S.debts.some(function(d){return n(d.bal)>0});st.push({k:"SPD",n:"Debt payoff speed",v:!hasDebt?(S.debts.some(function(d){return n(d.orig)>0})?99:null):sim.months?cap(99-sim.months*2):null,d:!hasDebt?"No debt HP recorded":sim.months?sim.months+" months to debt-free":"Needs monthly payments"});
  st.push({k:"INT",n:"Budget accuracy",v:null,d:"Opens when budgets are added"});
  st.push({k:"WIS",n:"Investing",v:null,d:"Opens when investments are tracked"});
  var ot=onTimePct();st.push({k:"POL",n:"Bills on time",v:ot===null?null:cap(ot*99),d:ot===null?"Needs bills with due days":Math.round(ot*100)+"% paid on or before due"});
  st.push({k:"LUK",n:"Windfalls",v:null,d:"Opens when windfalls are logged"});
  st.push({k:"LEAD",n:"Automation",v:null,d:"Opens when auto-transfers are tracked"});
  var sk=streakDays();st.push({k:"CHA",n:"Consistency",v:cap(sk*3),d:sk+" day logging streak"});
  return {st:st,spirit:T.free,total:sum(st,function(x){return x.v||0})};
}

    openSheet('<h3>'+(isNew?"New payroll item":"Edit payroll item")+'</h3>'+
      '<div class="field"><label class="lbl" for="cName">Name</label><input id="cName" placeholder="e.g. House rent" value="'+esc(k?k.name:c.name)+'"></div>'+
      '<div class="grid2"><div class="field"><label class="lbl" for="cAmt">Per month (RM)</label><input id="cAmt" inputmode="decimal" value="'+esc(k?k.amt:(c.amt==null?"":c.amt))+'"></div><div class="field"><label class="lbl" for="cDay">Due day (1-31)</label><input id="cDay" inputmode="numeric" value="'+esc(k?k.day:(c.day==null?"":c.day))+'"></div></div>'+
      '<div class="lbl" style="margin-bottom:6px">Category</div><div class="chips">'+CATS.map(function(x){return '<button class="chipb'+(cat===x?" on":"")+'" data-cc="'+esc(x)+'">'+esc(x)+'</button>'}).join("")+'</div>'+
      '<div class="row"><button class="btn grow" id="cSave">Save</button>'+(!isNew?'<button class="btn r" id="cDel">Remove</button>':'')+'</div>',function(sh){
      sh.querySelectorAll("[data-cc]").forEach(function(b){b.onclick=function(){cat=b.dataset.cc;draw({name:val("cName"),amt:val("cAmt"),day:val("cDay")})}});
      $("cSave").onclick=function(){var nm=val("cName");if(!nm){toast("Enter a name");return}c.name=nm;c.amt=numVal("cAmt");c.day=dayVal("cDay");c.cat=cat;if(isNew)S.commits.push(c);save();closeSheet();render();toast("Payroll saved")};
      if($("cDel"))$("cDel").onclick=function(){S.commits=S.commits.filter(function(x){return x.id!==c.id});save();closeSheet();render();toast("Payroll item removed")};
    });
  }
  draw();
}
function incSheet(i){
  openSheet('<h3>'+esc(i.name)+'</h3><div class="grid2"><div class="field"><label class="lbl" for="iEst">Monthly estimate (RM)</label><input id="iEst" inputmode="decimal" value="'+(i.est==null?"":i.est)+'"></div><div class="field"><label class="lbl" for="iDay">Lands on day (1-31)</label><input id="iDay" inputmode="numeric" value="'+(i.day==null?"":i.day)+'"></div></div>'+
    '<div class="hint">For variable pay this estimate is only for comparison. Log the real amount each month.</div><button class="btn" id="iSave" style="width:100%">Save</button>',function(){
    $("iSave").onclick=function(){i.est=numVal("iEst");i.day=dayVal("iDay");save();closeSheet();render();toast("Saved")}});
}
function goalSheet(g){
  openSheet('<h3>'+esc(g.name)+'</h3><div class="grid2"><div class="field"><label class="lbl" for="gT">Target (RM)</label><input id="gT" inputmode="decimal" value="'+(g.target==null?"":g.target)+'"></div><div class="field"><label class="lbl" for="gS">Already saved (RM)</label><input id="gS" inputmode="decimal" value="'+(g.start==null?"":g.start)+'"></div></div>'+
    '<div class="hint">Already saved = money in this pot before you started the ledger.</div><button class="btn" id="gSave" style="width:100%">Save</button>',function(){
    $("gSave").onclick=function(){g.target=numVal("gT");g.start=numVal("gS");save();closeSheet();render();toast("Army updated")}});
}

function exportData(){
  var json=JSON.stringify(S,null,1),name="simpansikit-ledger-"+todayStr()+".json",done=false;
  try{var file=new File([json],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(function(){});done=true}}catch(e){}
  if(!done){try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}}
  $("dumpBox").innerHTML='<div class="hint" style="margin:0 0 6px">If no file appears, copy this text into Notes or Files:</div><textarea class="dump" id="dump" readonly>'+esc(json)+'</textarea><button class="btn g sm" id="copyDump" style="margin-top:8px">Copy text</button>';
  $("copyDump").onclick=function(){var t=$("dump");if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(function(){toast("Copied")},function(){t.select()});else t.select()};
}
function importText(txt){
  try{var d=JSON.parse(txt);if(!d||!Array.isArray(d.tx)||!Array.isArray(d.debts))throw 0;
    confirmSheet("Replace the current ledger?","This copy has "+d.tx.length+" entries and "+d.debts.length+" debts. The ledger on this phone will be replaced.","Replace",function(){S=migrate(d);save();closeSheet();applySkin();render();toast("Ledger copy loaded")});
  }catch(e){toast("That ledger copy is not valid")}
}

document.addEventListener("click",function(e){
  if(e.target.closest("#layer"))return;
  var b=e.target.closest("[data-tab],[data-tx],[data-pay],[data-gaji],[data-filter],[data-method],[data-debt],[data-gin],[data-gout],[data-gedit],[data-commit],[data-inc],[data-quest],[data-sum],[data-hero],[data-skin],[data-roster],[data-camp],[data-skip],[data-lord]");
  if(b){var ds=b.dataset;
    if(ds.tab){tab=ds.tab;render();window.scrollTo(0,0);return}
    if(ds.tx){var t=S.tx.find(function(x){return x.id===ds.tx});if(t)txSheet({tx:t});return}
    if(ds.quest){var td=todayStr();S.quests[td]=S.quests[td]||{};S.quests[td][ds.quest]=!S.quests[td][ds.quest];save();render();if(questState(td).every(function(q){return q.on}))toast(totalFrag()%10===0&&totalFrag()>0?"All quests done · a Summon card is ready!":"All quests done · +1 card fragment");return}
    if(ds.pay){var p=ds.pay.split(":");
      if(p[0]==="c"){var c=S.commits.find(function(x){return x.id===p[1]});
        if(commitPaid(c,cur.y,cur.m))txSheet({tx:S.tx.find(function(x){return x.commitId===c.id&&inMonth(x,cur.y,cur.m)})});
        else txSheet({type:"out",cat:c.cat,amt:n(c.amt),note:c.name,commitId:c.id,date:dateInMonth(cur.y,cur.m,n(c.day)||new Date().getDate())});
      }else{var d=debtById(p[1]);txSheet({type:"debt",debtId:d.id,amt:Math.max(0,Math.min(d.min-debtPaidAmt(d,cur.y,cur.m),d.bal))||d.min,date:dateInMonth(cur.y,cur.m,n(d.day)||new Date().getDate())})}
      return}
    if(ds.gaji){var i=incById(ds.gaji);txSheet({type:"in",src:i.id,amt:i.id==="pm"?null:n(i.est),date:n(i.day)?dateInMonth(cur.y,cur.m,i.day):todayStr()});return}
    if(ds.filter){recFilter=ds.filter;render();return}
    if(ds.method){S.settings.method=ds.method;save();render();return}
    if(ds.debt){debtSheet(debtById(ds.debt));return}
    if(ds.gin){txSheet({type:"save",goalId:ds.gin,dir:1});return}
    if(ds.gout){txSheet({type:"save",goalId:ds.gout,dir:-1});return}
    if(ds.gedit){goalSheet(goalById(ds.gedit));return}
    if(ds.commit){commitSheet(S.commits.find(function(x){return x.id===ds.commit}));return}
    if(ds.inc){incSheet(incById(ds.inc));return}
    if(ds.sum){summonSheet();return}
    if(ds.camp){campSheet();return}
    if(ds.lord){lordSheet();return}
    if(ds.skip){if(skipsToday()<10){FN().skips={d:todayStr(),n:skipsToday()+1};finReward("ordinary","Impulse","Impulse buy");render()}return}
    if(ds.roster){rosterSheet();return}
    if(ds.hero&&ds.hero!=="none"){var Lp=LD().party,ix=Lp.indexOf(ds.hero);if(ix>=0)Lp.splice(ix,1);else if(partyList().length<partySize())Lp.push(ds.hero);else{toast("Party full ("+partySize()+"). Rank up for more seats");return}save();render();toast(ix>=0?rwById(ds.hero).name+" left the party":rwById(ds.hero).name+" joined the party");return}
    if(ds.hero){S.summon.hero=null;LD().party=[];save();render();toast(ds.hero==="none"?"Advisor dismissed":rwById(ds.hero).name+" is now your advisor");return}
    if(ds.skin){S.summon.skin=ds.skin;save();applySkin();render();toast("Skin: "+SKINS[ds.skin].name);return}
  }
  var t2=e.target;
  if(t2.closest("#addDebt"))debtSheet(null);
  else if(t2.closest("#addCommit"))commitSheet(null);
  else if(t2.closest("#exp"))exportData();
  else if(t2.closest("#impPaste")){$("dumpBox").innerHTML='<textarea class="dump" id="pasteIn" placeholder="Paste the ledger copy here"></textarea><button class="btn sm" id="doPaste" style="margin-top:8px">Import</button>';$("doPaste").onclick=function(){importText($("pasteIn").value)}}
  else if(t2.closest("#reset"))confirmSheet("Erase all data?","Every entry, debt and payroll item on this phone will be gone. Export a ledger copy first.","Erase all",function(){S=migrate(fresh());save();closeSheet();tab="home";applySkin();render();toast("Ledger erased")});
});
document.addEventListener("change",function(e){
  if(e.target.id==="impFile"&&e.target.files[0]){var r=new FileReader();r.onload=function(){importText(r.result)};r.readAsText(e.target.files[0]);e.target.value=""}
  if(e.target.id==="extra"){S.settings.extra=numVal("extra");save();render()}
  if(e.target.id==="soldier"){var v=numVal("soldier");S.settings.soldier=v&&v>0?v:10;save();render();toast("1 soldier = "+rm(S.settings.soldier))}
});
$("fab").onclick=function(){txSheet({type:"out",date:(cur.y===now.getFullYear()&&cur.m===now.getMonth())?todayStr():dateInMonth(cur.y,cur.m,1)})};
$("eye").onclick=function(){S.settings.hide=!S.settings.hide;save();render()};
$("mPrev").onclick=function(){cur.m--;if(cur.m<0){cur.m=11;cur.y--}render()};
$("mNext").onclick=function(){cur.m++;if(cur.m>11){cur.m=0;cur.y++}render()};
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheet()});
applySkin();
(function(){var g=accrue();save();render();if(g>=1)setTimeout(function(){toast("While you were away, Ye Feng's army earned ◆ "+jfmt(g))},600)})();
document.addEventListener("visibilitychange",function(){if(document.hidden){accrue();save()}else{var g=accrue();save();if(g>=1){render();toast("While you were away, Ye Feng's army earned ◆ "+jfmt(g))}}});
requestAnimationFrame(afkLoop);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
})();
</script>

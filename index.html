<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SimpanSikit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>SimpanSikit</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171c;--mute:#6b7280;--line:#e6e8ec;--acc:#0f766e;--acc2:#e6f4f2;--red:#c2410c;--red2:#fdeee6;--green:#15803d;--green2:#e8f5ec;--blue:#1d4ed8;--blue2:#e8eefc;--amber:#b45309;--sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--ink:#eef0f3;--mute:#9aa1ab;--line:#2a2e36;--acc:#2dd4bf;--acc2:#12302d;--red:#fb923c;--red2:#3a2215;--green:#4ade80;--green2:#15301e;--blue:#7aa2ff;--blue2:#18223a;--amber:#fbbf24;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
header h1{font-size:22px;margin:0;flex:1;letter-spacing:-.01em}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.ib svg{width:20px;height:20px}
.month{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.month b{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.big{font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lbl{font-size:13px;color:var(--mute);font-weight:600}
.sub{font-size:13px;color:var(--mute)}
.num{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.pos{color:var(--green)}.neg{color:var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--bg);border-radius:12px;padding:10px 12px}
.tile .num{font-size:17px;display:block;margin-top:2px}
h2{font-size:15px;margin:20px 2px 8px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0;padding-top:2px}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.d-out{background:var(--red2);color:var(--red)}.d-in{background:var(--green2);color:var(--green)}.d-debt{background:var(--blue2);color:var(--blue)}.d-save{background:var(--acc2);color:var(--acc)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.r i{background:var(--red)}.bar.b i{background:var(--blue)}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#fff;font-weight:650;cursor:pointer;text-align:center}
@media (prefers-color-scheme:dark){.btn{color:#062b27}}
.btn.g{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.r{background:var(--red2);color:var(--red)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.w{width:100%}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.pill{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 11px;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--acc);background:var(--acc2);color:var(--acc);font-weight:650}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--mute);font-weight:600;margin-bottom:4px}
.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:16px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:6px 14px;margin-bottom:12px}
.amt span{font-weight:700;color:var(--mute)}
.amt input{border:0;background:transparent;font-size:30px;font-weight:700;width:100%;padding:6px 0;outline:none;font-variant-numeric:tabular-nums}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--green2);color:var(--green)}
.tag.due{background:var(--red2);color:var(--red)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;border:0;background:none;padding:6px 2px;font-size:11.5px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc)}
.fab{position:fixed;right:max(18px,calc(50vw - 262px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--acc);color:#fff;box-shadow:0 6px 18px rgba(15,118,110,.35);display:grid;place-items:center;z-index:6;cursor:pointer}
.fab svg{width:26px;height:26px}
#layer{position:fixed;inset:0;z-index:20;display:none}
#layer.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:0 0 12px;font-size:19px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.hint{font-size:13px;color:var(--mute);margin:0 0 12px}
.warn{background:var(--red2);color:var(--red);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.catrow{margin-top:10px}
.catrow .row{font-size:14px}
body.hide .num.m{filter:blur(7px)}
.mini{font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1 id="ttl">SimpanSikit</h1><button class="ib" id="eye" aria-label="Hide balances"></button><button class="ib" id="gear" aria-label="Settings"></button></header>
  <div id="view"></div>
</div>
<button class="fab" id="fab" aria-label="Add entry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav><div class="in" id="nav"></div></nav>
<div id="layer"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
/* Data stays in this phone only (localStorage). Same storage key and data shape as the earlier
   game version, so existing records carry over. Fields this version does not use are kept as is. */
var KEY="simpansikit.v1";
var CATS=["Housing","Utilities & Internet","Car & Fuel","Food & Groceries","Lyla","Subscriptions","Insurance/Takaful","Sedekah","SB","Other"];
var CAT_AB={"Housing":"HS","Utilities & Internet":"UT","Car & Fuel":"CR","Food & Groceries":"FD","Lyla":"LY","Subscriptions":"SU","Insurance/Takaful":"TK","Sedekah":"SD","SB":"SB","Other":"OT"};
var DEBTS=["Atome PayLater","Atome i-Cash","TikTok PayLater","TikTok TrustFinancing-i","Grab PayLater","Ryt Credit PayLater","Atome Card","Boost PayLater"];
var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
var MON3=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var GOAL_NAMES={"Main Army (GX Bank)":"GX Bank","Main Army":"GX Bank","Garrison (TnG)":"Emergency fund (TnG)","Garrison":"Emergency fund (TnG)","Reserve Unit (Ryt)":"Ryt"};

function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function pad(x){return (x<10?"0":"")+x}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayStr(){return ymd(new Date())}
function fresh(){return {v:2,start:todayStr(),settings:{hide:false},
  incomes:[{id:"perseni",name:"Perseni salary",est:3500,day:25},{id:"pm",name:"PM salary",est:4300,day:15}],
  debts:DEBTS.map(function(x){return {id:uid(),name:x,bal:null,orig:null,min:null,day:null,rate:null}}),
  commits:[],goals:[{id:"saving",name:"GX Bank",target:null,start:null},{id:"ef",name:"Emergency fund (TnG)",target:null,start:null},{id:"reserve",name:"Ryt",target:null,start:null}],tx:[]}}
function migrate(d){
  d.settings=d.settings||{};d.incomes=d.incomes||[];d.debts=d.debts||[];d.commits=d.commits||[];d.goals=d.goals||[];d.tx=d.tx||[];if(!d.start)d.start=todayStr();
  d.goals.forEach(function(g){if(GOAL_NAMES[g.name])g.name=GOAL_NAMES[g.name]});
  return d}
var storageOK=true,S;
try{var raw=localStorage.getItem(KEY);S=migrate(raw?JSON.parse(raw):fresh())}catch(e){storageOK=false;S=migrate(fresh())}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false;toast("Could not save on this phone")}}

var now=new Date(),cur={y:now.getFullYear(),m:now.getMonth()},tab="home",recFilter="all";
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function n(v){return (v===null||v===undefined||v==="")?null:Number(v)}
function rm(v,sign){if(v===null||v===undefined||isNaN(v))return "—";return (sign&&v<0?"−":"")+"RM "+Math.abs(v).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2})}
function M(v,cls,sign){return '<span class="num m '+(cls||"")+'">'+rm(v,sign)+'</span>'}
function mkey(y,m){return y+"-"+pad(m+1)}
function inMonth(t,y,m){return t.date&&t.date.slice(0,7)===mkey(y,m)}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function dateInMonth(y,m,day){return mkey(y,m)+"-"+pad(Math.min(day||1,dim(y,m)))}
function fmtDate(s){var p=s.split("-");return parseInt(p[2],10)+" "+MON3[parseInt(p[1],10)-1]}
function sum(a,f){return a.reduce(function(s,x){return s+(f?f(x):x)},0)}
function debtById(id){return S.debts.find(function(d){return d.id===id})}
function goalById(id){return S.goals.find(function(g){return g.id===id})}
function incById(id){return S.incomes.find(function(i){return i.id===id})}
function val(id){var e=$(id);return e?e.value.trim():""}
function numVal(id){var v=val(id).replace(/,/g,"");if(v==="")return null;var x=Number(v);return isNaN(x)?null:Math.round(x*100)/100}
function dayVal(id){var x=numVal(id);if(x===null)return null;x=Math.round(x);return x>=1&&x<=31?x:null}

/* ---- money logic (same rules as before) ---- */
function commitPaid(c,y,m){return S.tx.some(function(x){return x.commitId===c.id&&inMonth(x,y,m)})}
function debtPaidAmt(d,y,m){return sum(S.tx.filter(function(x){return x.type==="debt"&&x.debtId===d.id&&inMonth(x,y,m)}),function(x){return x.amt})}
function goalSaved(g){return (n(g.start)||0)+sum(S.tx.filter(function(x){return x.type==="save"&&x.goalId===g.id}),function(x){return x.amt})-sum(S.tx.filter(function(x){return x.acct===g.id&&(x.type==="out"||x.type==="debt")}),function(x){return n(x.amt)||0})}
function txNet(x){if(x.acct&&(x.type==="out"||x.type==="debt"))return 0;return x.type==="in"?x.amt:-(n(x.amt)||0)}
function carryIn(y,m){var ms=dateInMonth(y,m,1),me=dateInMonth(y,m,dim(y,m)),ob=S.settings.opening,c=0;
  if(ob&&n(ob.amt)!=null&&ob.date){if(ob.date>me)return 0;c=n(ob.amt)||0;
    S.tx.forEach(function(x){if(x.date>=ob.date&&x.date<ms)c+=txNet(x);if(x.date<ob.date&&x.date>=ms&&x.date<=me)c-=txNet(x)});return Math.round(c*100)/100}
  S.tx.forEach(function(x){if(x.date<ms)c+=txNet(x)});return Math.round(c*100)/100}
function monthTotals(y,m){
  var t=S.tx.filter(function(x){return inMonth(x,y,m)}),o={inc:0,out:0,debt:0,save:0,list:t};
  t.forEach(function(x){var k={in:"inc",out:"out",debt:"debt",save:"save"}[x.type];if(k)o[k]+=n(x.amt)||0});
  o.carry=carryIn(y,m);o.fromPots=sum(t.filter(function(x){return x.acct&&(x.type==="out"||x.type==="debt")}),function(x){return x.amt});
  o.main=o.inc-o.out-o.debt-o.save+o.fromPots+o.carry;
  var uc=S.commits.filter(function(c){return n(c.amt)&&!commitPaid(c,y,m)});
  var ud=S.debts.filter(function(d){return n(d.bal)>0&&n(d.min)&&debtPaidAmt(d,y,m)<d.min});
  o.pending=sum(uc,function(c){return c.amt})+sum(ud,function(d){return Math.min(d.min-debtPaidAmt(d,y,m),d.bal)});
  o.free=o.main-o.pending;return o}
function applyEffect(t){if(t.type==="debt"){var d=debtById(t.debtId);if(d&&n(d.bal)!==null){if(n(d.orig)===null||d.orig<d.bal)d.orig=d.bal;d.bal=Math.max(0,Math.round((d.bal-t.amt)*100)/100);t.applied=true}}}
function undoEffect(t){if(t.type==="debt"&&t.applied){var d=debtById(t.debtId);if(d&&n(d.bal)!==null)d.bal=Math.round((d.bal+t.amt)*100)/100;t.applied=false}}
function totalDebt(){return sum(S.debts,function(d){return n(d.bal)||0})}
function totalSaved(){return sum(S.goals,goalSaved)}
function autoIncome(){var td=todayStr(),y=now.getFullYear(),m=now.getMonth(),key=y+"-"+m;S.settings.autoT=S.settings.autoT||{};var asked=null;
  S.incomes.forEach(function(i){if(!n(i.day))return;var pd=dateInMonth(y,m,Math.min(i.day,dim(y,m)));if(td<pd)return;var k=i.id+":"+key;if(S.settings.autoT[k])return;
    var got=S.tx.some(function(x){return x.type==="in"&&x.src===i.id&&inMonth(x,y,m)});S.settings.autoT[k]=1;if(got)return;
    if(i.id==="pm"){asked={i:i,pd:pd};return}
    if(n(i.est)){S.tx.push({id:uid(),ts:Date.now(),type:"in",src:i.id,amt:n(i.est),date:pd,note:"Auto · pay day",auto:true});toast(i.name+" recorded "+rm(i.est)+". Edit in Records if different.")}});
  save();if(asked)setTimeout(function(){toast("Pay day: enter the real "+asked.i.name);txSheet({type:"in",src:asked.i.id,date:asked.pd})},500)}

/* ---- ui helpers ---- */
var IC={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
 rec:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 debt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>',
 acc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
 eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 eyeoff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>',
 l:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>',
 r:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>'};
var NAV=[["home","Home",IC.home],["rekod","Records",IC.rec],["hutang","Debts",IC.debt],["akaun","Accounts",IC.acc]];
var TITLES={home:"SimpanSikit",rekod:"Records",hutang:"Debts",akaun:"Accounts",set:"Settings"};
var tt;function toast(m){var e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("on")},2200)}
function openSheet(html,after){var L=$("layer");L.innerHTML='<div class="scrim"></div><div class="sheet" role="dialog"><div class="grab"></div>'+html+'</div>';L.classList.add("on");L.querySelector(".scrim").onclick=closeSheet;if(after)after(L.querySelector(".sheet"))}
function closeSheet(){var L=$("layer");L.classList.remove("on");L.innerHTML=""}
function confirmSheet(title,msg,okLabel,onOk,onCancel){openSheet('<h3>'+title+'</h3><p class="hint">'+msg+'</p><div class="row"><button class="btn g grow" id="cNo">Cancel</button><button class="btn r grow" id="cOk">'+okLabel+'</button></div>',function(){$("cNo").onclick=function(){onCancel?onCancel():closeSheet()};$("cOk").onclick=onOk})}
function monthBar(){return '<div class="month"><button class="ib" data-mv="-1" aria-label="Previous month">'+IC.l+'</button><b>'+MONTHS[cur.m]+' '+cur.y+'</b><button class="ib" data-mv="1" aria-label="Next month">'+IC.r+'</button></div>'}
function txLabel(x){
  if(x.type==="in"){var i=incById(x.src);return i?i.name:"Income"}
  if(x.type==="debt"){var d=debtById(x.debtId);return "Pay "+(d?d.name:"debt")}
  if(x.type==="save"){var g=goalById(x.goalId);return (x.amt<0?"Withdraw · ":"Save · ")+(g?g.name:"savings")}
  if(x.commitId){var c=S.commits.find(function(k){return k.id===x.commitId});if(c)return c.name}
  return x.cat||"Spending"}

function plan(){ /* snowball: smallest balance first; whole monthly budget goes to debts in that order */
  var ds=S.debts.filter(function(d){return n(d.bal)>0}).map(function(d){return {id:d.id,bal:n(d.bal)}}).sort(function(a,b){return a.bal-b.bal});
  var B=n(S.settings.debtBudget),done={},m=0;if(!B||B<=0||!ds.length)return {order:ds.map(function(x){return x.id}),months:null,done:done};
  var order=ds.map(function(x){return x.id}),left=ds.map(function(x){return x.bal});
  while(left.some(function(v){return v>0.005})&&m<600){m++;var cash=B;for(var i=0;i<left.length&&cash>0;i++){if(left[i]<=0.005)continue;var p=Math.min(cash,left[i]);left[i]-=p;cash-=p;if(left[i]<=0.005&&!done[order[i]])done[order[i]]=m}}
  return {order:order,months:m>=600?null:m,done:done}}
function addMonths(k){var d=new Date(now.getFullYear(),now.getMonth()+k,1);return MON3[d.getMonth()]+" "+d.getFullYear()}

  var h='<div class="card"><div class="lbl">Total owed</div><div class="big">'+M(bal,bal>0?"neg":"")+'</div>'+
    (lim?'<div class="sub">Total limit '+M(lim)+' · still free '+M(Math.max(0,lim-sum(S.debts,function(d){return n(d.limit)?Math.min(n(d.bal)||0,d.limit):0})))+'</div>':'')+
    (orig?'<div class="bar b"><i style="width:'+pct(orig-bal,orig)+'%"></i></div><div class="mini" style="margin-top:4px">'+Math.round(pct(orig-bal,orig))+'% paid off since you started tracking</div>':'')+'</div>';
  var first=P.order.length?debtById(P.order[0]):null;
  if(first)h+='<div class="card" style="border-color:var(--blue)"><div class="lbl">Clear this one first</div><div class="row" style="margin-top:4px"><div class="grow"><div class="t" style="font-weight:700;font-size:18px">'+esc(first.name)+'</div><div class="sub">Smallest balance. Clearing it fast frees up its payment for the next one.</div></div>'+M(n(first.bal),"neg")+'</div><button class="btn w" data-paydebt="'+first.id+'" style="margin-top:12px">Record a payment</button></div>';
  else if(bal===0&&orig>0)h+='<div class="card"><div class="t" style="font-weight:700">All debts cleared. Well done, boss.</div></div>';
  h+='<div class="card"><div class="field" style="margin:0"><label for="dBud">How much can you put on debts each month? (RM)</label><input id="dBud" inputmode="decimal" placeholder="e.g. 1500" value="'+(B==null?"":B)+'"></div>'+
    (P.months?'<div style="margin-top:10px"><div class="lbl">Debt-free by</div><div class="big" style="font-size:26px">'+addMonths(P.months)+'</div><div class="sub">'+P.months+' months at '+rm(B)+' a month, smallest debt first.</div></div>':(B?'':'<p class="hint" style="margin:8px 0 0">Enter an amount to see when you will be debt-free.</p>'))+'</div>';
  h+='<h2>Order to clear</h2><div class="card">';
  var rank={};P.order.forEach(function(id,i){rank[id]=i+1});
  var ds=S.debts.slice().sort(function(a,b){var ra=rank[a.id]||999,rb=rank[b.id]||999;return ra-rb});
  if(!ds.length)h+='<div class="empty">No debts added.</div>';
  ds.forEach(function(d){var b=n(d.bal),l=n(d.limit),o=n(d.orig)||b,r=rank[d.id];
    h+='<div class="li" data-debt="'+d.id+'" style="display:block"><div class="row"><div class="dot d-debt">'+(r||(b===0?"✓":"–"))+'</div><div class="grow"><div class="t">'+esc(d.name)+'</div><div class="sub">'+(l?'Limit '+M(l)+' · free '+M(Math.max(0,l-(b||0))):'No limit set')+(P.done[d.id]?' · clear ~'+addMonths(P.done[d.id]):'')+'</div></div>'+(b===null?'<span class="mini">Tap to set</span>':b===0?'<span class="tag">Cleared</span>':M(b,"neg"))+'</div>'+
      (o&&b!==null&&b>0?'<div class="bar b"><i style="width:'+pct(o-b,o)+'%"></i></div>':'')+'</div>'});
  h+='</div><button class="btn g w" id="addDebt">+ Add debt</button>';

function txSheet(opts){
  opts=opts||{};var ex=opts.tx;
  var st={type:ex?ex.type:(opts.type||"out"),cat:ex?ex.cat:(opts.cat||null),src:ex?ex.src:(opts.src||(S.incomes[0]&&S.incomes[0].id)),debtId:ex?ex.debtId:(opts.debtId||null),goalId:ex?ex.goalId:(opts.goalId||(S.goals[0]&&S.goals[0].id)),acct:ex?(ex.acct||null):(opts.acct||null),dir:ex&&ex.type==="save"&&ex.amt<0?-1:(opts.dir||1)};
  var keep={amt:ex?String(Math.abs(ex.amt)):(opts.amt!=null?String(opts.amt):""),date:ex?ex.date:(opts.date||todayStr()),note:ex?(ex.note||""):(opts.note||"")};
  function body(){
    var h='<h3>'+(ex?"Edit entry":"New entry")+'</h3>';
    if(!ex)h+='<div class="pills">'+[["out","Spending"],["in","Income"],["debt","Pay debt"],["save","Savings"]].map(function(p){return '<button class="pill'+(st.type===p[0]?" on":"")+'" data-st="'+p[0]+'">'+p[1]+'</button>'}).join("")+'</div>';
    h+='<div class="amt"><span>RM</span><input id="fAmt" inputmode="decimal" placeholder="0.00" value="'+esc(keep.amt)+'" autocomplete="off"></div>';
    if(st.type==="out")h+='<div class="lbl" style="margin-bottom:6px">Category</div><div class="chips">'+CATS.map(function(c){return '<button class="chip'+(st.cat===c?" on":"")+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>'}).join("")+'</div>';
    if(st.type==="in"){h+='<div class="lbl" style="margin-bottom:6px">From</div><div class="chips">'+S.incomes.map(function(i){return '<button class="chip'+(st.src===i.id?" on":"")+'" data-src="'+i.id+'">'+esc(i.name)+'</button>'}).join("")+'</div>';
      var inc=incById(st.src);if(inc&&n(inc.est))h+='<p class="hint">Usual amount: '+rm(inc.est)+'. Enter the real amount.</p>'}
    if(st.type==="debt"){h+='<div class="lbl" style="margin-bottom:6px">Which debt</div><div class="chips">'+S.debts.filter(function(d){return n(d.bal)!==0||d.id===st.debtId}).map(function(d){return '<button class="chip'+(st.debtId===d.id?" on":"")+'" data-debtc="'+d.id+'">'+esc(d.name)+'</button>'}).join("")+'</div>';
      var dd=debtById(st.debtId);if(dd)h+='<p class="hint">Balance now: '+rm(n(dd.bal))+'. Paying lowers it automatically.</p>'}
    if(st.type==="save"){h+='<div class="lbl" style="margin-bottom:6px">Account</div><div class="chips">'+S.goals.map(function(g){return '<button class="chip'+(st.goalId===g.id?" on":"")+'" data-goal2="'+g.id+'">'+esc(g.name)+'</button>'}).join("")+'</div><div class="pills">'+[[1,"Put in"],[-1,"Take out"]].map(function(p){return '<button class="pill'+(st.dir===p[0]?" on":"")+'" data-dir="'+p[0]+'">'+p[1]+'</button>'}).join("")+'</div><p class="hint">Moves money between your main account and this savings account.</p>'}
    if(st.type==="out"||st.type==="debt")h+='<div class="lbl" style="margin-bottom:6px">Paid from</div><div class="chips">'+[["","Main account (HLBB)"]].concat(S.goals.map(function(g){return [g.id,g.name]})).map(function(p){return '<button class="chip'+((st.acct||"")===p[0]?" on":"")+'" data-acct="'+p[0]+'">'+esc(p[1])+'</button>'}).join("")+'</div>';
    h+='<div class="f2"><div class="field"><label for="fDate">Date</label><input id="fDate" type="date" value="'+esc(keep.date)+'"></div><div class="field"><label for="fNote">Note</label><input id="fNote" placeholder="optional" value="'+esc(keep.note)+'"></div></div>';
    h+='<div class="row"><button class="btn grow" id="fSave">Save</button>'+(ex?'<button class="btn r" id="fDel">Delete</button>':'')+'</div>';
    return h}
  function mount(){openSheet(body(),function(sh){var a=$("fAmt");if(!ex&&!keep.amt)setTimeout(function(){a.focus()},60);
    sh.onclick=function(e){var b=e.target.closest("button");if(!b)return;keep={amt:val("fAmt"),date:val("fDate"),note:val("fNote")};var ds=b.dataset;
      if(ds.st){st.type=ds.st;mount()}else if(ds.cat){st.cat=ds.cat;mount()}else if(ds.src){st.src=ds.src;mount()}
      else if(ds.debtc){st.debtId=ds.debtc;var d=debtById(st.debtId);if(!keep.amt&&d&&n(d.min))keep.amt=String(d.min);mount()}
      else if(ds.goal2){st.goalId=ds.goal2;mount()}else if(ds.dir){st.dir=Number(ds.dir);mount()}

  function doSave(){
    var amt=numVal("fAmt");if(!amt||amt<=0){toast("Enter an amount first");return}

    if(st.type==="save"&&!st.goalId){toast("Pick an account");return}
    if(ex)undoEffect(ex);
    var t=ex||{id:uid(),ts:Date.now()};
    t.type=st.type;t.amt=st.type==="save"?amt*st.dir:amt;t.date=val("fDate")||todayStr();t.note=val("fNote");

    if((st.type==="out"||st.type==="debt")&&st.acct)t.acct=st.acct;else delete t.acct;

    toast(ex?"Updated":t.type==="debt"?"Payment recorded":t.type==="in"?"Income recorded":t.type==="save"?"Savings updated":"Spending recorded")}
  mount()}

function goalSheet(g){

  var s=isNew?0:goalSaved(g);
  openSheet('<h3>'+(isNew?"New savings account":esc(g.name))+'</h3>'+
    (!isNew?'<div class="row" style="margin-bottom:14px"><button class="btn grow" id="gIn">Put in</button><button class="btn g grow" id="gOut">Take out</button></div><p class="hint">Balance now: '+rm(s)+'</p>':'')+
    '<div class="field"><label for="gN">Name</label><input id="gN" placeholder="e.g. GX Bank" value="'+esc(g.name)+'"></div>'+
    '<div class="f2"><div class="field"><label for="gT">Target (RM)</label><input id="gT" inputmode="decimal" placeholder="optional" value="'+(g.target==null?"":g.target)+'"></div><div class="field"><label for="gS">Starting balance (RM)</label><input id="gS" inputmode="decimal" value="'+(g.start==null?"":g.start)+'"></div></div>'+
    '<p class="hint">Starting balance = money already in this account before you started using the app.</p><button class="btn w" id="gSave">Save</button>',function(){
    $("gSave").onclick=function(){var nm=val("gN");if(!nm){toast("Enter a name");return}g.name=nm;g.target=numVal("gT");g.start=numVal("gS");if(isNew)S.goals.push(g);save();closeSheet();render();toast("Saved")};
    if($("gIn"))$("gIn").onclick=function(){txSheet({type:"save",goalId:g.id,dir:1})};
    if($("gOut"))$("gOut").onclick=function(){txSheet({type:"save",goalId:g.id,dir:-1})}})}

function incSheet(i){
  openSheet('<h3>'+esc(i.name)+'</h3><div class="field"><label for="iN">Name</label><input id="iN" value="'+esc(i.name)+'"></div><div class="f2"><div class="field"><label for="iEst">Usual amount (RM)</label><input id="iEst" inputmode="decimal" value="'+(i.est==null?"":i.est)+'"></div><div class="field"><label for="iDay">Pay day (1-31)</label><input id="iDay" inputmode="numeric" value="'+(i.day==null?"":i.day)+'"></div></div>'+
    '<p class="hint">On pay day the app records the usual amount for you (for PM salary it asks for the real amount).</p><button class="btn w" id="iSave">Save</button>',function(){
    $("iSave").onclick=function(){i.name=val("iN")||i.name;i.est=numVal("iEst");i.day=dayVal("iDay");save();closeSheet();render();toast("Saved")}})}

function commitSheet(c){
  var isNew=!c;c=c||{id:uid(),name:"",cat:"Housing",amt:null,day:null};var cat=c.cat||"Other";
  function draw(k){openSheet('<h3>'+(isNew?"New monthly bill":"Edit monthly bill")+'</h3><div class="field"><label for="cN">Name</label><input id="cN" placeholder="e.g. House rent" value="'+esc(k?k.name:c.name)+'"></div>'+
    '<div class="f2"><div class="field"><label for="cA">Per month (RM)</label><input id="cA" inputmode="decimal" value="'+esc(k?k.amt:(c.amt==null?"":c.amt))+'"></div><div class="field"><label for="cD">Due day (1-31)</label><input id="cD" inputmode="numeric" value="'+esc(k?k.day:(c.day==null?"":c.day))+'"></div></div>'+
    '<div class="lbl" style="margin-bottom:6px">Category</div><div class="chips">'+CATS.map(function(x){return '<button class="chip'+(cat===x?" on":"")+'" data-cc="'+esc(x)+'">'+esc(x)+'</button>'}).join("")+'</div>'+
    '<div class="row"><button class="btn grow" id="cSave">Save</button>'+(!isNew?'<button class="btn r" id="cDel">Remove</button>':'')+'</div>',function(sh){
      sh.onclick=function(e){var b=e.target.closest("[data-cc]");if(b){cat=b.dataset.cc;draw({name:val("cN"),amt:val("cA"),day:val("cD")})}};
      $("cSave").onclick=function(){var nm=val("cN");if(!nm){toast("Enter a name");return}c.name=nm;c.amt=numVal("cA");c.day=dayVal("cD");c.cat=cat;if(isNew)S.commits.push(c);save();closeSheet();render();toast("Saved")};
      if($("cDel"))$("cDel").onclick=function(){confirmSheet("Remove "+esc(c.name)+"?","Past payments stay in Records.","Remove",function(){S.commits=S.commits.filter(function(x){return x.id!==c.id});save();closeSheet();render()},function(){draw()})}})}
  draw()}

function openBal(){var ob=S.settings.opening||{};
  openSheet('<h3>Main account starting balance</h3><p class="hint">How much was in your main account (HLBB) on this date. Everything you record after it is added or taken off.</p><div class="amt"><span>RM</span><input id="obAmt" inputmode="decimal" placeholder="0.00" value="'+(ob.amt==null?"":ob.amt)+'"></div><div class="field"><label for="obDate">As of date</label><input id="obDate" type="date" value="'+(ob.date||todayStr())+'"></div><button class="btn w" id="obSave">Save</button>'+(ob.date?'<div style="height:8px"></div><button class="btn g w" id="obClr">Clear starting balance</button>':''),function(){
    $("obSave").onclick=function(){var a=numVal("obAmt"),d=val("obDate")||todayStr();S.settings.opening=a==null?null:{amt:a,date:d};save();closeSheet();render();toast("Saved")};
    if($("obClr"))$("obClr").onclick=function(){S.settings.opening=null;save();closeSheet();render()}})}

function exportData(){
  var json=JSON.stringify(S,null,1),name="simpansikit-backup-"+todayStr()+".json",done=false;
  try{var file=new File([json],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(function(){});done=true}}catch(e){}
  if(!done){try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}}
  $("dumpBox").innerHTML='<p class="hint">If no file appears, copy this text into Notes or Files:</p><textarea id="dump" readonly style="width:100%;height:120px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:8px;font-size:12px">'+esc(json)+'</textarea><button class="btn g sm" id="copyDump" style="margin-top:8px">Copy text</button>';
  $("copyDump").onclick=function(){var t=$("dump");if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(function(){toast("Copied")},function(){t.select()});else t.select()}}
function importText(txt){
  try{var d=JSON.parse(txt);if(!d||!Array.isArray(d.tx)||!Array.isArray(d.debts))throw 0;
    confirmSheet("Replace data on this phone?","This backup has "+d.tx.length+" entries and "+d.debts.length+" debts. Everything on this phone now will be replaced. Export a backup first if unsure.","Replace",function(){S=migrate(d);save();closeSheet();render();toast("Backup loaded")})
  }catch(e){toast("That backup is not valid")}}

/* ---- events ---- */
document.addEventListener("click",function(e){
  if(e.target.closest("#layer"))return;
  var b=e.target.closest("[data-tab],[data-mv],[data-tx],[data-filter],[data-debt],[data-goal],[data-inc],[data-commit],[data-paycommit],[data-paydebt],[data-go]");
  if(b){var ds=b.dataset;
    if(ds.tab){tab=ds.tab;render();window.scrollTo(0,0);return}
    if(ds.go){tab=ds.go;render();window.scrollTo(0,0);return}
    if(ds.mv){cur.m+=Number(ds.mv);if(cur.m<0){cur.m=11;cur.y--}if(cur.m>11){cur.m=0;cur.y++}render();return}
    if(ds.tx){var t=S.tx.find(function(x){return x.id===ds.tx});if(t)txSheet({tx:t});return}
    if(ds.filter){recFilter=ds.filter;render();return}
    if(ds.debt){var d=debtById(ds.debt);if(d)debtSheet(d);return}
    if(ds.goal){var g=goalById(ds.goal);if(g)goalSheet(g);return}
    if(ds.inc){var i=incById(ds.inc);if(i)incSheet(i);return}
    if(ds.commit){var c=S.commits.find(function(x){return x.id===ds.commit});if(c)commitSheet(c);return}
    if(ds.paycommit){var c2=S.commits.find(function(x){return x.id===ds.paycommit});if(c2)txSheet({type:"out",cat:c2.cat,amt:n(c2.amt),commitId:c2.id,note:c2.name,date:dateInMonth(cur.y,cur.m,Math.min(now.getDate(),dim(cur.y,cur.m)))});return}
    if(ds.paydebt){var d2=debtById(ds.paydebt);if(d2)txSheet({type:"debt",debtId:d2.id,amt:n(d2.min)});return}}
  var t2=e.target;
  if(t2.closest("#addDebt"))debtSheet(null);
  else if(t2.closest("#addGoal"))goalSheet(null);
  else if(t2.closest("#addCommit"))commitSheet(null);
  else if(t2.closest("#openBal"))openBal();
  else if(t2.closest("#exp"))exportData();
  else if(t2.closest("#impPaste")){$("dumpBox").innerHTML='<textarea id="pasteIn" placeholder="Paste the backup text here" style="width:100%;height:120px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:8px;font-size:12px"></textarea><button class="btn sm" id="doPaste" style="margin-top:8px">Import</button>';$("doPaste").onclick=function(){importText($("pasteIn").value)}}
});
document.addEventListener("change",function(e){if(e.target.id==="dBud"){S.settings.debtBudget=numVal("dBud");save();render();return}if(e.target.id==="impFile"&&e.target.files[0]){var r=new FileReader();r.onload=function(){importText(String(r.result))};r.readAsText(e.target.files[0]);e.target.value=""}});
$("fab").onclick=function(){var same=cur.y===now.getFullYear()&&cur.m===now.getMonth();txSheet({date:same?todayStr():dateInMonth(cur.y,cur.m,1)})};
$("eye").onclick=function(){S.settings.hide=!S.settings.hide;save();render()};
$("gear").onclick=function(){tab="set";render();window.scrollTo(0,0)};

render();
try{autoIncome();render()}catch(e){}
if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
